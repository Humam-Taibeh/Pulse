#  Pulse — continuous integration
#
#  Pulse is a Windows-only application driving a Windows-only engine, so
#  every job here runs on windows-latest. There is no Linux fallback to be
#  had: the GUI tests send live Win32 messages and the backend calls DWM,
#  the registry and winget.
#
#  Four gates, deliberately ordered cheapest-first so an obvious break
#  reports in seconds instead of after a full Qt install:
#     1. powershell-parse  — every .ps1 tokenizes            (~10s)
#     2. powershell-lint   — PSScriptAnalyzer, zero findings (~40s)
#     3. powershell-tests  — Pester, backup/restore engine   (~1m)
#     4. python-tests      — the pytest regression suite     (~3m)
#
name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:
  # Called by .github/workflows/release.yml so a release is gated on these
  # exact four jobs rather than on a second, drifting copy of them. There
  # is one definition of "green" in this repository, and this is it.
  workflow_call:

# A new push to the same branch makes an in-flight run obsolete.
#
# github.workflow IS IN THE KEY BECAUSE THIS WORKFLOW IS ALSO CALLED. In a
# reusable workflow both github.ref and github.workflow resolve to the
# CALLER's - so without the workflow name, release.yml's `verify` job on
# master shared a group with master's own push run and cancelled it.
# Observed, not theorised: run 64 was cancelled by the first dry run of
# release.yml, leaving master's latest CI run reading "cancelled" and the
# README's live badge rendering that.
#
# It does not arise on a real tag push, where the caller's ref is
# refs/tags/vX.Y.Z - only when a dry run is dispatched on the same branch
# that is already building, which is exactly what the README tells people
# to do before cutting a tag.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ============================================================
  #  1. Every PowerShell file parses
  # ============================================================
  # KEEP EVERY `run:` BLOCK ON THIS JOB (AND THE OTHER PowerShell ONES)
  # PURE ASCII. The runner writes each step to D:\a\_temp\<guid>.ps1 as
  # UTF-8 WITHOUT A BOM, and `shell: powershell` is Windows PowerShell 5.1,
  # which reads a BOM-less file in the ANSI codepage. An em-dash is UTF-8
  # E2 80 94, and cp1252 decodes that last byte as U+201D RIGHT DOUBLE
  # QUOTATION MARK — which PowerShell accepts as a STRING DELIMITER. So one
  # em-dash in a comment or a message closes the string it sits in and the
  # rest of the step cascades into "Unexpected token" / "Missing closing '}'"
  # errors that name lines nowhere near the real one. That is exactly how
  # this job failed while every .ps1 in the repo tokenized cleanly.
  powershell-parse:
    name: PowerShell parse check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Tokenize every .ps1
        shell: powershell
        run: |
          $files = Get-ChildItem -Path "src\backend" -Filter *.ps1 -Recurse
          if ($files.Count -eq 0) {
            Write-Error "No .ps1 files found - the backend path is wrong."
            exit 1
          }
          $failed = 0
          foreach ($f in $files) {
            $errors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile(
              $f.FullName, [ref]$null, [ref]$errors)
            if ($errors.Count -gt 0) {
              $failed++
              Write-Output "::error file=$($f.FullName)::$($errors.Count) parse error(s)"
              foreach ($e in $errors) {
                Write-Output "  L$($e.Extent.StartLineNumber): $($e.Message)"
              }
            }
          }
          Write-Output "Parsed $($files.Count) file(s); $failed failed."
          if ($failed -gt 0) { exit 1 }

  # ============================================================
  #  2. PSScriptAnalyzer — zero findings against the tuned rule set
  # ============================================================
  powershell-lint:
    name: PSScriptAnalyzer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install PSScriptAnalyzer
        shell: powershell
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name PSScriptAnalyzer -Scope CurrentUser -Force

      # The rule set is tuned in PSScriptAnalyzerSettings.psd1, where every
      # exclusion carries a written architectural rationale. Because that
      # file brings the tree to a genuine ZERO, the gate can be absolute —
      # any new finding is a real regression, not baseline noise.
      - name: Analyze
        shell: powershell
        run: |
          $findings = Invoke-ScriptAnalyzer -Path "src\backend" -Recurse `
            -Settings ".\PSScriptAnalyzerSettings.psd1"
          if ($findings) {
            foreach ($f in $findings) {
              $level = if ($f.Severity -eq 'Error') { 'error' } else { 'warning' }
              Write-Output "::$level file=$($f.ScriptPath),line=$($f.Line)::$($f.RuleName): $($f.Message)"
            }
            Write-Output "PSScriptAnalyzer reported $($findings.Count) finding(s)."
            exit 1
          }
          Write-Output "PSScriptAnalyzer: clean."

  # ============================================================
  #  3. Pester — the backup/restore engine actually executes
  # ============================================================
  powershell-tests:
    name: Pester (backend)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Pester
        shell: powershell
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name Pester -MinimumVersion 5.5.0 -Scope CurrentUser `
            -Force -SkipPublisherCheck

      # These tests do real registry I/O, deliberately: mocking the registry
      # would test the mock, and the invariants here (first-write-wins, the
      # __NOTSET__ sentinel) are exactly the ones that only bite against a
      # real hive. Everything is confined to HKCU:\Software\PulsePesterTests
      # and removed in AfterAll; nothing needs elevation.
      - name: Run Pester
        shell: powershell
        run: |
          Import-Module Pester -MinimumVersion 5.0 -Force
          $config = New-PesterConfiguration
          $config.Run.Path = 'tests\backend'
          $config.Run.Exit = $true
          $config.Output.Verbosity = 'Detailed'
          $config.TestResult.Enabled = $true
          $config.TestResult.OutputPath = 'pester.xml'
          Invoke-Pester -Configuration $config

      - name: Upload Pester results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pester-results
          path: pester.xml

  # ============================================================
  #  4. The pytest regression suite
  # ============================================================
  python-tests:
    name: pytest (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip -r requirements-dev.txt

      # NOTE: QT_QPA_PLATFORM is deliberately NOT set to offscreen.
      # 80 of the 991 collected tests are marked `native` — they hit-test
      # the non-client area, query DWM and pump real Win32 messages, none
      # of which exist on the offscreen platform plugin. GitHub's
      # windows-latest runners provide a real window station, so the full
      # suite runs here. conftest.pytest_collection_modifyitems skips the
      # native set automatically if this ever lands somewhere headless, so
      # a desktop-less runner degrades to 911 green tests instead of the
      # full 991 — but that would be a silent loss of coverage, hence the
      # explicit floor asserted in the step below.
      #
      # There is no GPU path to cover any more: v10.6 deleted the ambient
      # field and its OpenGL renderer outright, so the app asks nothing of
      # the graphics stack beyond what Qt needs to draw a gradient.
      # THE RUNNER'S DESKTOP IS 1024x768, AND A QUARTER OF THIS SUITE CARES.
      #
      # Measured from a failing run: a resize(1150, 780) came back
      # (1044, 780) — the window was clamped by the desktop, not by the app.
      # Everything downstream of that clamp then failed for the same reason
      # and looked like four different bugs: the caption-button hit tests
      # answered RIGHT (the window edge sat under the probe points), the
      # masthead tagline could not un-elide because resize(1400, 900) never
      # delivered 1400, and the reflow test compared a clamped size against
      # the one it asked for.
      #
      # 1920x1080 is what the geometry tests were written against, so this
      # is the runner catching up with the suite rather than the suite
      # being relaxed to fit the runner. Non-fatal on purpose: if a future
      # image drops the cmdlet or refuses the mode, the job should still
      # run and report what it actually got, not die here.
      - name: Give the runner a desktop the geometry tests can use
        shell: powershell
        run: |
          if (Get-Command Set-DisplayResolution -ErrorAction SilentlyContinue) {
            try {
              Set-DisplayResolution -Width 1920 -Height 1080 -Force
              Write-Output "Set-DisplayResolution: requested 1920x1080"
            } catch {
              Write-Output "Set-DisplayResolution failed: $($_.Exception.Message)"
            }
          } else {
            Write-Output "Set-DisplayResolution is not available on this image."
          }
          Add-Type -AssemblyName System.Windows.Forms
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          Write-Output "primary screen is now $($b.Width)x$($b.Height)"

      - name: Run tests
        env:
          # The wall-clock render budget, raised for THIS MACHINE rather
          # than for all machines — which is exactly what the knob is for
          # (see the note in tests/test_shell_budget.py).
          #
          # Two independent reasons the runner needs a bigger number, and
          # neither is a regression in the app:
          #   * it is ~1.4x slower than a developer box, measured by
          #     comparing the same test's reported median on both;
          #   * the step above hands the suite a REAL 1300x860 window where
          #     it used to get a 1044px-wide clamp, so every frame now
          #     paints the pixels it was always supposed to.
          # 30ms keeps the alarm's original shape — it still trips on a
          # doubling of the runner's own baseline (~15-20ms), which is what
          # the guard exists to catch.
          PULSE_RENDER_BUDGET_MS: "30"
        # THE EXIT CODE IS REPORTED SEPARATELY FROM THE TEST RESULT, and
        # they are not the same fact. A run whose every assertion passed
        # can still end non-zero: Qt calls qFatal and ABORTS when a QThread
        # is destroyed while running, or when a widget outlives its
        # QApplication, and neither writes a traceback. The step then fails
        # with pwsh's own "Process completed with exit code 1" while pytest
        # printed a green summary two lines above — which reads as anything
        # except what it is.
        #
        # Printing the real code makes the two states distinguishable at a
        # glance: 0 with a green summary is clean; 1 means tests actually
        # failed; anything else (3, 0xC0000409, ...) is a crash during
        # shutdown, and the number itself says which kind.
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          python -m pytest tests -v --junitxml=junit.xml
          $code = $LASTEXITCODE
          Write-Output "pytest process exit code: $code"
          if ($code -ne 0) {
            if ($code -ne 1) {
              Write-Output "::error::pytest exited $code with no test failures - this is a crash during interpreter shutdown, not a failing assertion."
            }
            exit $code
          }

      # Guard against the degradation described above: if the runner ever
      # loses its desktop session, the suite would still be "green" while
      # silently testing none of the Win32 behaviour. Fail loudly instead.
      #
      # THIS GUARD USED TO MEASURE THE WRONG QUANTITY, and that is why it
      # kept going stale. It asserted a floor on the number of tests
      # EXECUTED (`ran >= N`), which is a function of the whole suite's
      # size — so every time the suite grew, a headless run executed more
      # tests, drifted up through the floor, and the guard began passing
      # while protecting nothing. It happened twice: written at 670 when
      # 713 were collected, re-measured to 950 at 991 collected, and by
      # 1031 collected a headless run executed 951 — clearing the floor by
      # a single test. The number was always going to be overtaken by the
      # suite it was measured against.
      #
      # SKIPPED COUNT IS THE INVARIANT. A headless runner skips the whole
      # native subset at once (80 tests as of this writing), while a
      # healthy run skips only its environment cases: one non-Windows
      # degradation path in test_process_job, plus the 2 playbook tests
      # that skip on an elevated runner by design. That is ~3 against ~80,
      # and — unlike the execution floor — the separation does not narrow
      # as the suite grows. It WIDENS: more native tests means a bigger
      # skip count on a headless runner, further from the threshold, while
      # the healthy figure stays where it is. A suite that grows can no
      # longer silently satisfy this.
      #
      # 20 sits an order of magnitude above the healthy figure and well
      # under a headless one. Raising it is only ever correct alongside a
      # real increase in environment-conditional skips — never to make a
      # red build go green.
      #
      # The collected-count floor below is a DIFFERENT check and is safe
      # as a literal in a way the execution floor was not: collection only
      # grows, so a number falling under it is a real failure (a broken
      # import taking a module's tests with it), and a growing suite can
      # never make it pass when it should fail. Its drift is therefore the
      # harmless direction — it goes SLACK rather than blind — so it is
      # tightened when the suite grows rather than re-derived. At 1049
      # collected, 990 leaves 59 of headroom: enough that ordinary churn
      # (a deleted test file) does not fail the build, tight enough that
      # the largest single module going missing does.
      - name: Assert the native tests actually ran
        shell: powershell
        run: |
          [xml]$results = Get-Content junit.xml
          $suite = $results.testsuites.testsuite
          $total = [int]$suite.tests
          $skipped = [int]$suite.skipped
          $ran = $total - $skipped
          Write-Output "collected=$total ran=$ran skipped=$skipped"
          if ($skipped -gt 20) {
            Write-Error "$skipped test(s) skipped - a healthy runner skips about 3. The native subset was almost certainly skipped wholesale, which means the runner has no desktop session and none of the Win32 behaviour was tested."
            exit 1
          }
          if ($total -lt 990) {
            Write-Error "Only $total test(s) collected - collection broke (an import error takes a whole module's tests with it silently)."
            exit 1
          }

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-results
          path: junit.xml
